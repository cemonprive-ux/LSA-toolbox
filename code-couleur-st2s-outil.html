document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element, warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags, manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames, from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below, so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document, a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts, file://, everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe), location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match, accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative, never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate, a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor'), an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent, the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs ,
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here, they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin, blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec, re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page, from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

['NOISE','JOIN','VOICE','enJOY'] },\n  { g:2, ipa:'eə', word:'HAIR',   ink:'#C4116C', border:'#E5127D', tint:'#FDECF4', cwIpa:'/heə/', cwSyl:'1', cwStress:'monosyllabe',\n    doc:['CARE','SHARE'], more:['AIR','FAIR','PArents','WEARing'] },\n  { g:2, ipa:'əʊ', word:'YELLOW', ink:'#A87C00', border:'#E8B400', tint:'#FDF7E2', cwIpa:'/ˈjeləʊ/', cwSyl:'2', cwStress:'1re syllabe : YEL',\n    doc:['SOcial','LOcal'], more:['HOME','KNOW','OLD','ALso'] },\n  { g:2, ipa:'aʊ', word:'BROWN',  ink:'#7A4E24', border:'#8B5A2B', tint:'#F6F0E9', cwIpa:'/braʊn/', cwSyl:'1', cwStress:'monosyllabe',\n    doc:['COUNselling','OUTcome'], more:['HOUSE','DOWN','aROUND','aBOUT'] },\n  { g:2, ipa:'ɪə', word:'CLEAR',  ink:'#2C7FB4', border:'#3E9BD8', tint:'#EBF4FA', cwIpa:'/klɪə/', cwSyl:'1', cwStress:'monosyllabe',\n    doc:['HEARing','caREER'], more:['YEAR','HERE','NEAR','SErious'] }\n];\n\nconst IPA_WORD = {\n  clinic:'/ˈklɪnɪk/', illness:'/ˈɪlnəs/', health:'/helθ/', welfare:'/ˈwelfeə/',\n  cancer:'/ˈkænsə/', manage:'/ˈmænɪdʒ/', hospital:'/ˈhɒspɪtl/', doctor:'/ˈdɒktə/',\n  good:'/ɡʊd/', book:'/bʊk/', blood:'/blʌd/', public:'/ˈpʌblɪk/',\n  disease:'/dɪˈziːz/', screening:'/ˈskriːnɪŋ/', heart:'/hɑːt/', staff:'/stɑːf/',\n  support:'/səˈpɔːt/', ward:'/wɔːd/', food:'/fuːd/', school:'/skuːl/',\n  nurse:'/nɜːs/', worker:'/ˈwɜːkə/', patient:'/ˈpeɪʃnt/', ageing:'/ˈeɪdʒɪŋ/',\n  child:'/tʃaɪld/', rights:'/raɪts/', employment:'/ɪmˈplɔɪmənt/', choice:'/tʃɔɪs/',\n  care:'/keə/', share:'/ʃeə/', social:'/ˈsəʊʃl/', local:'/ˈləʊkl/',\n  counselling:'/ˈkaʊnsəlɪŋ/', outcome:'/ˈaʊtkʌm/', hearing:'/ˈhɪərɪŋ/', career:'/kəˈrɪə/'\n};\n\n/* Formants F1/F2/F3 de l'anglais britannique standard (RP), voyelle isolée.\n   Deux cibles = diphtongue (glissement de la 1re vers la 2e). */\nconst FORMANTS = {\n  'ɪ':  { t: [[360, 2100, 2700]], d: 0.26 },\n  'e':  { t: [[570, 1970, 2600]], d: 0.28 },\n  'æ':  { t: [[750, 1750, 2500]], d: 0.32 },\n  'ɒ':  { t: [[560, 920, 2560]],  d: 0.28 },\n  'ʊ':  { t: [[380, 940, 2300]],  d: 0.26 },\n  'ʌ':  { t: [[680, 1080, 2540]], d: 0.28 },\n  'iː': { t: [[285, 2250, 2900]], d: 0.46 },\n  'ɑː': { t: [[700, 1080, 2540]], d: 0.48 },\n  'ɔː': { t: [[390, 700, 2500]],  d: 0.48 },\n  'uː': { t: [[310, 1100, 2300]], d: 0.46 },\n  'ɜː': { t: [[520, 1450, 2500]], d: 0.48 },\n  'eɪ': { t: [[570, 1950, 2600], [380, 2150, 2700]], d: 0.50 },\n  'aɪ': { t: [[760, 1330, 2500], [380, 2150, 2700]], d: 0.52 },\n  'ɔɪ': { t: [[400, 700, 2500],  [380, 2100, 2700]], d: 0.52 },\n  'eə': { t: [[600, 1900, 2550], [520, 1480, 2500]], d: 0.50 },\n  'əʊ': { t: [[520, 1300, 2450], [380, 940, 2300]],  d: 0.50 },\n  'aʊ': { t: [[760, 1300, 2500], [380, 940, 2300]],  d: 0.52 },\n  'ɪə': { t: [[370, 2100, 2700], [520, 1480, 2500]], d: 0.50 }\n};\n\nconst GROUPS = [\n  { n:1, label:'Voyelles courtes', band:'#D6003F' },\n  { n:2, label:'Voyelles longues', band:'#12793E' },\n  { n:3, label:'Diphtongues',      band:'#5B2D8E' }\n];\n\nconst ACTS = [\n  { id:'mix',    label:'Série mixte' },\n  { id:'listen', label:'Listen and choose' },\n  { id:'colour', label:'Which colour?' },\n  { id:'odd',    label:'Odd one out' },\n  { id:'same',   label:'Same or different?' }\n];\nconst SCOPES = [\n  { id:'all',  label:'Les 18 sons' },\n  { id:'0',    label:'Voyelles courtes' },\n  { id:'1',    label:'Voyelles longues' },\n  { id:'2',    label:'Diphtongues' }\n];\n\nfunction parse(w) {\n  const m = /^([a-z]*)([A-Z]+)([a-z]*)$/.exec(w);\n  if (!m) return { pre:'', st:w, post:'', word:w.toLowerCase() };\n  return { pre:m[1], st:m[2], post:m[3], word:(m[1]+m[2]+m[3]).toLowerCase() };\n}\nfunction pick(a) { return a[Math.floor(Math.random() * a.length)]; }\nfunction shuffle(a) { const r = a.slice(); for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; }\n\nclass Component extends DCLogic {\n  state = { tab: 'code', sel: 0, act: 'mix', scope: 'all', q: null, answer: null, score: 0, asked: 0, voiceName: '' };\n\n  componentDidMount() {\n    this.voice = null;\n    this.loadVoices();\n    if (window.speechSynthesis) window.speechSynthesis.onvoiceschanged = () => this.loadVoices();\n    // getVoices() est souvent vide au premier appel : on réessaie.\n    this.voiceTries = 0;\n    this.voiceTimer = setInterval(() => {\n      this.voiceTries++;\n      this.loadVoices();\n      if (this.voice || this.voiceTries > 20) clearInterval(this.voiceTimer);\n    }, 250);\n    this.setState({ q: this.makeQ() });\n  }\n  componentWillUnmount() { if (this.voiceTimer) clearInterval(this.voiceTimer); }\n\n  loadVoices() {\n    const vs = (window.speechSynthesis && window.speechSynthesis.getVoices()) || [];\n    const gb = vs.filter(v => /^en[-_]GB/i.test(v.lang));\n    const named = gb.find(v => /(daniel|kate|serena|arthur|martha|libby|sonia|ryan|british|google uk)/i.test(v.name));\n    const en = vs.filter(v => /^en/i.test(v.lang));\n    const picked = named || gb[0] || en.find(v => /^en[-_]AU|^en[-_]IE/i.test(v.lang)) || en[0] || null;\n    const list = (gb.length ? gb : en);\n    const changed = (this.voice && this.voice.name) !== (picked && picked.name) || this.voiceList !== list.length;\n    this.voice = this.state.voiceName ? (vs.find(v => v.name === this.state.voiceName) || picked) : picked;\n    this.voiceOptions = list;\n    this.voiceList = list.length;\n    if (changed) this.forceUpdate();\n  }\n\n  audioCtx() {\n    const AC = window.AudioContext || window.webkitAudioContext;\n    if (!AC) return null;\n    if (!this.ac) this.ac = new AC();\n    if (this.ac.state === 'suspended') this.ac.resume();\n    return this.ac;\n  }\n\n  /* Synthèse par formants : source glottale filtrée par 3 bandes (F1, F2, F3). */\n  playPhoneme(ipa) {\n    const F = FORMANTS[ipa];\n    const ac = this.audioCtx();\n    if (!F || !ac) return;\n    if (window.speechSynthesis) window.speechSynthesis.cancel();\n\n    const t0 = ac.currentTime + 0.03;\n    const dur = F.d;\n    const glide = F.t.length > 1;\n\n    const src = ac.createOscillator();\n    src.type = 'sawtooth';\n    src.frequency.setValueAtTime(134, t0);\n    src.frequency.linearRampToValueAtTime(106, t0 + dur);\n\n    const vib = ac.createOscillator();\n    vib.type = 'sine';\n    vib.frequency.value = 4.6;\n    const vibG = ac.createGain();\n    vibG.gain.value = 2.2;\n    vib.connect(vibG);\n    vibG.connect(src.frequency);\n\n    const tilt = ac.createBiquadFilter();\n    tilt.type = 'lowpass';\n    tilt.frequency.value = 3900;\n    tilt.Q.value = 0.4;\n    src.connect(tilt);\n\n    const mix = ac.createGain();\n    mix.gain.value = 0.9;\n    const GAIN = [1.0, 0.5, 0.2];\n    const BW = [70, 105, 145];\n    for (let k = 0; k < 3; k++) {\n      const a = F.t[0][k], b = F.t[F.t.length - 1][k];\n      const bp = ac.createBiquadFilter();\n      bp.type = 'bandpass';\n      bp.Q.value = a / BW[k];\n      bp.frequency.setValueAtTime(a, t0);\n      if (glide) {\n        bp.frequency.setValueAtTime(a, t0 + dur * 0.30);\n        bp.frequency.linearRampToValueAtTime(b, t0 + dur * 0.82);\n      }\n      const g = ac.createGain();\n      g.gain.value = GAIN[k];\n      tilt.connect(bp);\n      bp.connect(g);\n      g.connect(mix);\n    }\n\n    const env = ac.createGain();\n    env.gain.setValueAtTime(0.0001, t0);\n    env.gain.linearRampToValueAtTime(0.85, t0 + 0.035);\n    env.gain.setValueAtTime(0.85, t0 + dur - 0.08);\n    env.gain.linearRampToValueAtTime(0.0001, t0 + dur);\n    mix.connect(env);\n    env.connect(ac.destination);\n\n    src.start(t0); vib.start(t0);\n    src.stop(t0 + dur + 0.05); vib.stop(t0 + dur + 0.05);\n  }\n\n  say(text, slow) {\n    if (!window.speechSynthesis) return;\n    window.speechSynthesis.cancel();\n    if (!this.voice) this.loadVoices();\n    const u = new SpeechSynthesisUtterance(text);\n    u.lang = 'en-GB';\n    // Sans voix anglaise assignée, le moteur lit avec la voix par défaut (souvent française).\n    if (this.voice) { u.voice = this.voice; u.lang = this.voice.lang; }\n    u.rate = slow ? 0.55 : (this.props.speechRate ?? 0.85);\n    u.pitch = 1;\n    window.speechSynthesis.speak(u);\n  }\n\n  poolIdx() {\n    const s = this.state.scope;\n    return RAW.map((r, i) => i).filter(i => s === 'all' || RAW[i].g === Number(s));\n  }\n  wordsOf(i) { return RAW[i].doc.concat(RAW[i].more).map(parse); }\n\n  makeQ() {\n    const kind = this.state.act === 'mix' ? pick(['listen', 'colour', 'odd', 'same']) : this.state.act;\n    const pool = this.poolIdx();\n    if (kind === 'same') {\n      const same = Math.random() < 0.5;\n      const a = pick(pool);\n      const b = same ? a : pick(pool.filter(i => i !== a));\n      const wa = pick(this.wordsOf(a)), wbList = this.wordsOf(b);\n      const wb = pick(same ? wbList.filter(w => w.word !== wa.word) : wbList);\n      return { kind, a, b, wa, wb, same, correct: same ? 'same' : 'diff' };\n    }\n    if (kind === 'odd') {\n      const a = pick(pool);\n      const b = pick(pool.filter(i => i !== a));\n      const three = shuffle(this.wordsOf(a)).slice(0, 3);\n      const odd = pick(this.wordsOf(b));\n      return { kind, a, b, items: shuffle(three.concat([odd])), correct: odd.word, odd, three };\n    }\n    const t = pick(pool);\n    const w = pick(this.wordsOf(t));\n    const others = shuffle(pool.filter(i => i !== t)).slice(0, 3);\n    return { kind, target: t, w, choices: shuffle([t].concat(others)), correct: t };\n  }\n\n  answerIt(val) {\n    if (this.state.answer !== null) return;\n    const ok = String(val) === String(this.state.q.correct);\n    this.setState(s => ({ answer: val, score: s.score + (ok ? 1 : 0), asked: s.asked + 1 }));\n  }\n  next() { this.setState({ q: this.makeQ(), answer: null }); }\n\n  chipStyle(on) {\n    return 'padding: 7px 13px; border-radius: 999px; font-size: 13.5px; font-weight: 600; cursor: pointer; border: 1.5px solid ' +\n      (on ? '#16305B' : '#DDE3EA') + '; background: ' + (on ? '#16305B' : '#fff') + '; color: ' + (on ? '#fff' : '#5A687E');\n  }\n  optStyle(state) {\n    const base = 'display: flex; align-items: center; gap: 9px; padding: 12px 14px; border-radius: 10px; font-size: 15px; cursor: pointer; text-align: left; background: #fff; border: 2px solid ';\n    if (state === 'good') return base + '#12793E; background: #EAF4EE; color: #12793E';\n    if (state === 'bad') return base + '#D6003F; background: #FDEEF3; color: #D6003F';\n    if (state === 'dim') return base + '#E8ECF1; color: #9AA3B0';\n    return base + '#DDE3EA; color: #16233A';\n  }\n\n  buildSound(i, withHandlers) {\n    const r = RAW[i];\n    const docEx = r.doc.map(parse).map(e => Object.assign({}, e, { ipa: IPA_WORD[e.word] || '', onSpeak: () => this.say(e.word) }));\n    const moreEx = r.more.map(parse).map(e => Object.assign({}, e, { onSpeak: () => this.say(e.word) }));\n    return {\n      id: i, showIpa: this.props.showIpaOnCards ?? true, ipa: r.ipa, ipaSlash: '/' + r.ipa + '/', word: r.word, wordLower: r.word.toLowerCase(),\n      ink: r.ink, tint: r.tint, groupLabel: GROUPS[r.g].label,\n      cwIpa: r.cwIpa, cwSyl: r.cwSyl, cwStress: r.cwStress,\n      docEx, moreEx,\n      soundHint: 'Phonème isolé, synthétisé sur les formants de l’anglais britannique standard (RP). Écoutez-le plusieurs fois, puis comparez avec le mot-repère.',\n      onSelect: () => { this.setState({ sel: i }); this.say(r.word.toLowerCase()); },\n      onSound: () => this.playPhoneme(r.ipa),\n      onWord: () => this.say(r.word.toLowerCase()),\n      cardStyle: 'display: flex; flex-direction: column; align-items: center; gap: 7px; padding: 11px 9px 12px; border-radius: 10px; cursor: pointer; transition: transform .12s, box-shadow .12s; background: ' +\n        (this.state.sel === i ? r.tint : '#fff') + '; border: 2px solid ' + r.border +\n        (this.state.sel === i ? '; box-shadow: 0 0 0 3px ' + r.border + '33' : '')\n    };\n  }\n\n  renderVals() {\n    const st = this.state;\n    const tabOn = 'padding: 8px 16px; border-radius: 7px; border: none; font-size: 14px; font-weight: 600; cursor: pointer; background: #fff; color: #16305B';\n    const tabOff = 'padding: 8px 16px; border-radius: 7px; border: none; font-size: 14px; font-weight: 600; cursor: pointer; background: transparent; color: #C8D5E8';\n\n    const groups = GROUPS.map((g, gi) => {\n      const sounds = RAW.map((r, i) => i).filter(i => RAW[i].g === gi).map(i => this.buildSound(i));\n      return { n: g.n, label: g.label, band: g.band, count: sounds.length + ' sons', sounds };\n    });\n\n    const v = {\n      isCode: st.tab === 'code', isTrain: st.tab === 'train',\n      goCode: () => this.setState({ tab: 'code' }), goTrain: () => this.setState({ tab: 'train' }),\n      tabCodeStyle: st.tab === 'code' ? tabOn : tabOff,\n      tabTrainStyle: st.tab === 'train' ? tabOn : tabOff,\n      voiceChoices: (this.voiceOptions && this.voiceOptions.length)\n        ? this.voiceOptions.map(v => ({ value: v.name, label: v.name + ' (' + v.lang + ')' }))\n        : [{ value: '', label: 'Aucune voix anglaise détectée' }],\n      voiceValue: (this.voice && this.voice.name) || '',\n      onVoiceChange: (e) => {\n        const name = e.target.value;\n        const vs = (window.speechSynthesis && window.speechSynthesis.getVoices()) || [];\n        this.voice = vs.find(v => v.name === name) || this.voice;\n        this.setState({ voiceName: name }, () => this.say(st.sel !== null ? RAW[st.sel].word.toLowerCase() : 'health'));\n      },\n      groups,\n      hasSel: st.sel !== null, noSel: st.sel === null,\n      sel: st.sel === null ? {} : this.buildSound(st.sel),\n      actChips: ACTS.map(a => ({ label: a.label, style: this.chipStyle(st.act === a.id), onPick: () => this.setState({ act: a.id, q: null, answer: null }, () => this.setState({ q: this.makeQ() })) })),\n      scopeChips: SCOPES.map(s => ({ label: s.label, style: this.chipStyle(st.scope === s.id), onPick: () => this.setState({ scope: s.id, answer: null }, () => this.setState({ q: this.makeQ() })) })),\n      score: st.score, asked: st.asked,\n      onNext: () => this.next(),\n      onReset: () => this.setState({ score: 0, asked: 0, answer: null, q: this.makeQ() }),\n      qHasPlay: false, qHasText: false, qPlays: [], options: [],\n      playsLabel: 'Écouter', optionsLabel: 'Choisir la couleur',\n      qTextPre: '', qTextSt: '', qTextPost: '',\n      hasFeedback: false, fbTitle: '', fbBody: '', fbBorder: '#12793E', fbBg: '#EAF4EE',\n      showTeacherKey: false, teacherKey: '',\n      qTitle: '', qPrompt: ''\n    };\n\n    const q = st.q;\n    if (!q) { v.qTitle = 'Préparation…'; v.qPrompt = 'Chargement de l’exercice.'; return v; }\n    const answered = st.answer !== null;\n\n    if (q.kind === 'listen' || q.kind === 'colour') {\n      const r = RAW[q.target];\n      v.qTitle = q.kind === 'listen' ? 'Listen and choose' : 'Which colour?';\n      v.qPrompt = q.kind === 'listen'\n        ? 'Écoutez le mot, repérez le son de sa syllabe accentuée, puis choisissez la couleur correspondante.'\n        : 'Voici un mot avec sa syllabe accentuée soulignée. Quelle couleur du code correspond à sa voyelle accentuée ?';\n      v.qHasPlay = true;\n      v.qPlays = [{ label: q.kind === 'listen' ? 'Écouter le mot' : 'Écouter « ' + q.w.word + ' »', onPlay: () => this.say(q.w.word) }];\n      if (q.kind === 'colour' || answered) {\n        v.qHasText = true; v.qTextPre = q.w.pre; v.qTextSt = q.w.st; v.qTextPost = q.w.post;\n      }\n      v.options = q.choices.map(i => {\n        const rr = RAW[i];\n        let state = null;\n        if (answered) state = i === q.correct ? 'good' : (String(i) === String(st.answer) ? 'bad' : 'dim');\n        return { label: rr.word, sub: '/' + rr.ipa + '/', hasDot: true, dot: rr.border, style: this.optStyle(state), onPick: () => this.answerIt(i) };\n      });\n      if (answered) {\n        const ok = String(st.answer) === String(q.correct);\n        v.hasFeedback = true;\n        v.fbTitle = ok ? 'Correct !' : 'Ce n’est pas la bonne couleur.';\n        v.fbBorder = ok ? '#12793E' : '#D6003F';\n        v.fbBg = ok ? '#EAF4EE' : '#FDEEF3';\n        const mono = q.w.pre === '' && q.w.post === '';\n        v.fbBody = mono\n          ? '« ' + q.w.word + ' » ' + (IPA_WORD[q.w.word] || '') + ' est un monosyllabe : sa voyelle est /' + r.ipa + '/, donc la couleur est ' + r.word + '.'\n          : '« ' + q.w.word + ' » ' + (IPA_WORD[q.w.word] || '') + ', la syllabe accentuée est « ' + q.w.st.toLowerCase() + ' » et sa voyelle est /' + r.ipa + '/, donc la couleur est ' + r.word + '.';\n      }\n      v.showTeacherKey = (this.props.teacherMode ?? false) && !answered;\n      v.teacherKey = q.w.word + ' → /' + r.ipa + '/ → ' + r.word;\n      return v;\n    }\n\n    if (q.kind === 'odd') {\n      v.qTitle = 'Odd one out';\n      v.qPrompt = 'Trois de ces mots ont le même son voyelle accentué. Trouvez l’intrus. Cliquez sur un mot pour l’écouter d’abord.';\n      v.qHasPlay = true;\n      v.playsLabel = 'Écouter les mots';\n      v.optionsLabel = 'Choisir l’intrus';\n      v.qPlays = q.items.map(w => ({ label: w.word, onPlay: () => this.say(w.word) }));\n      v.options = q.items.map(w => {\n        let state = null;\n        if (answered) state = w.word === q.correct ? 'good' : (w.word === st.answer ? 'bad' : 'dim');\n        return { label: w.word, sub: answered ? (IPA_WORD[w.word] || '') : '', hasDot: false, dot: '#fff', style: this.optStyle(state), onPick: () => this.answerIt(w.word) };\n      });\n      if (answered) {\n        const ok = st.answer === q.correct;\n        const ra = RAW[q.a], rb = RAW[q.b];\n        v.hasFeedback = true;\n        v.fbTitle = ok ? 'Correct !' : 'Raté.';\n        v.fbBorder = ok ? '#12793E' : '#D6003F';\n        v.fbBg = ok ? '#EAF4EE' : '#FDEEF3';\n        v.fbBody = 'L’intrus est « ' + q.odd.word + ' » : sa voyelle accentuée est /' + rb.ipa + '/ (' + rb.word + '). Les trois autres ont /' + ra.ipa + '/ (' + ra.word + ').';\n      }\n      v.showTeacherKey = (this.props.teacherMode ?? false) && !answered;\n      v.teacherKey = 'intrus = ' + q.odd.word + ' (/' + RAW[q.b].ipa + '/ ' + RAW[q.b].word + ')';\n      return v;\n    }\n\n    v.qTitle = 'Same sound or different sound?';\n    v.qPrompt = 'Écoutez les deux mots. Leur son voyelle accentué est-il le même ?';\n    v.qHasPlay = true;\n    v.playsLabel = 'Écouter les deux mots';\n    v.optionsLabel = 'Votre réponse';\n    v.qPlays = [\n      { label: '1, ' + (answered ? q.wa.word : 'premier mot'), onPlay: () => this.say(q.wa.word) },\n      { label: '2, ' + (answered ? q.wb.word : 'second mot'), onPlay: () => this.say(q.wb.word) }\n    ];\n    v.options = [\n      { id: 'same', label: 'Même son' },\n      { id: 'diff', label: 'Son différent' }\n    ].map(o => {\n      let state = null;\n      if (answered) state = o.id === q.correct ? 'good' : (o.id === st.answer ? 'bad' : 'dim');\n      return { label: o.label, sub: '', hasDot: false, dot: '#fff', style: this.optStyle(state), onPick: () => this.answerIt(o.id) };\n    });\n    if (answered) {\n      const ok = st.answer === q.correct;\n      const ra = RAW[q.a], rb = RAW[q.b];\n      v.hasFeedback = true;\n      v.fbTitle = ok ? 'Correct !' : 'Raté.';\n      v.fbBorder = ok ? '#12793E' : '#D6003F';\n      v.fbBg = ok ? '#EAF4EE' : '#FDEEF3';\n      v.fbBody = q.same\n        ? q.wa.word + ' et ' + q.wb.word + ' ont tous deux /' + ra.ipa + '/ → ' + ra.word + '.'\n        : q.wa.word + ' a /' + ra.ipa + '/ (' + ra.word + ') tandis que ' + q.wb.word + ' a /' + rb.ipa + '/ (' + rb.word + ').';\n    }\n    v.showTeacherKey = (this.props.teacherMode ?? false) && !answered;\n    v.teacherKey = q.wa.word + ' /' + RAW[q.a].ipa + '/ vs ' + q.wb.word + ' /' + RAW[q.b].ipa + '/ → ' + (q.same ? 'même son' : 'son différent');\n    return v;\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
